# nuclei | public-config.yaml
# Headers to include with all HTTP requests
header:
  X-BugBounty-Hackerone: 'Hackerone'
  User-Agent: 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15; rv:108.0) Gecko/20100101 Firefox/108.0'

# maximum number of templates executed in parallel
# concurrency: 25
# rate-limit: 100

# Template Denylist
exclude-tags: [technologies, tech, ssl, dns]
severity: [critical, high, medium, low]

exclude-templates:
  # vulnerabilities wordpress
  - vulnerabilities/wordpress/wp-license-file.yaml
